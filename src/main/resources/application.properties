spring.datasource.url=jdbc:postgresql://localhost:5432/teamchat
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=db/migration

spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=redispassword
spring.redis.timeout=2000ms
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=0

#spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

server.port=8080

app.jwt.secret=teamchat-secret-key-change-in-production-must-be-256-bits-long
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

app.websocket.heartbeat=10000
app.websocket.disconnect-delay=30000

app.rate-limit.messages-per-minute=60
app.rate-limit.enabled=true

app.redis.presence-ttl=60
app.redis.typing-ttl=5
app.redis.retry-queue-ttl=86400

logging.level.com.teamchat=DEBUG
logging.level.org.springframework.web.socket=INFO